name: Build Rosario Market Android 3.0

on:
  push:
    branches: [rosario-market-android-v2]
    paths:
      - 'android-v2/**'
      - '.github/workflows/build-android-v2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add Rosario Market app icon
        run: |
          mkdir -p android-v2/app/src/main/res/drawable
          curl -fL "https://raw.githubusercontent.com/contactooffertas/FrontEndAmbos/main/public/assets/navbarbolsa.png" -o android-v2/app/src/main/res/drawable/app_icon.png

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-v2
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-v2/app/build/outputs/apk/debug/app-debug.apk Rosario-Market-3.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Rosario-Market-3.0-APK
          path: Rosario-Market-3.0.apk
          retention-days: 30

      - name: Publish APK for website download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-v3.0.0 >/dev/null 2>&1; then
            gh release upload android-v3.0.0 Rosario-Market-3.0.apk --clobber
          else
            gh release create android-v3.0.0 Rosario-Market-3.0.apk --title "Rosario Market 3.0" --notes "Rosario Market Android 3.0"
          fi
