name: Build Rosario Market Android 3.9.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-android-v2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Android 3.9.6 source branch
        uses: actions/checkout@v4
        with:
          ref: rosario-market-android-v2

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: android-v2
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp android-v2/app/build/outputs/apk/debug/app-debug.apk Rosario-Market-3.9.6.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rosario-Market-3.9.6-APK
          path: Rosario-Market-3.9.6.apk
          retention-days: 30

      - name: Publish direct APK download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-v3.9.6 >/dev/null 2>&1; then
            gh release upload android-v3.9.6 Rosario-Market-3.9.6.apk --clobber
          else
            gh release create android-v3.9.6 Rosario-Market-3.9.6.apk --title "Rosario Market 3.9.6" --notes "Notificaciones nativas en segundo plano, contador acumulado y confirmación de entrega."
          fi

      - name: Publish APK inside Rosario Market website
        run: |
          mkdir -p /tmp/rm-apk
          cp Rosario-Market-3.9.6.apk /tmp/rm-apk/Rosario-Market-3.9.6.apk
          git fetch origin main
          git checkout -B main origin/main
          mkdir -p public/downloads
          cp /tmp/rm-apk/Rosario-Market-3.9.6.apk public/downloads/Rosario-Market-3.9.6.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/downloads/Rosario-Market-3.9.6.apk
          git commit -m "chore(android): publish downloadable APK 3.9.6"
          git push origin main

